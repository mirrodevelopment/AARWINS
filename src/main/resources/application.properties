# ═══════════════════════════════════════════════
# AARWINS APPLICATION PROPERTIES
# ═══════════════════════════════════════════════

spring.application.name=aarwins

# ── Server ──────────────────────────────────────
server.port=8080

# ── H2 Database Configuration (File-based, persistent) ─────────────────────────────
spring.datasource.url=jdbc:h2:file:./data/aarwins_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (Optional, available at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate/JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── SQL Init (seed data) ─────────────────────────
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ── Jackson ──────────────────────────────────────
# Removed write-dates-as-timestamps due to Jackson 3 enum changes
spring.jackson.default-property-inclusion=non_null

# ── Logging ──────────────────────────────────────
logging.level.com.aarwins=INFO
logging.level.org.springframework.security=WARN
