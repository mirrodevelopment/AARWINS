
name: AARWINS Backend Build

on:
  push:
    branches:
      - main
    paths:
      - 'src/main/**'
      - 'src/test/**'
      - 'pom.xml'
      - 'mvnw'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode clean verify
